<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>クロススターズ ライフカウンター v5.2.2 LOCAL</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<main id="app" aria-label="クロススターズ ライフカウンター">
  <section class="row top" id="topRow"></section>
  <section class="row bottom" id="bottomRow"></section>
</main>

<div class="overlay" id="menuOverlay">
  <div class="menu" role="dialog" aria-modal="true">
    <h2>ゲームメニュー</h2>

    <div class="menu-grid">
      <button class="next" id="nextBtn">NEXT ROUND<small>ダメージのみ0／覚醒・装備は維持</small></button>
      <button class="reset" id="resetBtn">RESET<small>ダメージ・覚醒・装備を初期化</small></button>
      <button class="flip-btn" id="flipBtn">上半分 反転：OFF<small>対面プレイ向け</small></button>
      <button class="close" id="optionsBtn">文字サイズ設定<small>ダメージ・ライフを個別調整</small></button>
      <button class="close" id="backgroundBtn">背景画像設定<small>8面それぞれに画像を登録</small></button>
      <button class="close" id="closeBtn">閉じる</button>
    </div>

    <div class="options" id="optionsPanel">
      <div class="option-row">
        <label for="damageSize">ダメージ</label>
        <input id="damageSize" type="range" min="60" max="150" step="5" value="100">
        <span class="option-value" id="damageSizeValue">100%</span>
      </div>
      <div class="option-row">
        <label for="lifeSize">ライフ</label>
        <input id="lifeSize" type="range" min="60" max="150" step="5" value="100">
        <span class="option-value" id="lifeSizeValue">100%</span>
      </div>
      <div class="option-note">100%を基準サイズとして、ダメージとライフを個別に調整できます。ライフの基準サイズは小さめに設定しています。設定はこのブラウザに保存されます。</div>
      <div class="option-actions">
        <button id="sizeDefaultBtn">100%に戻す</button>
        <button id="optionsCloseBtn">設定を閉じる</button>
      </div>
    </div>

    <div class="backgrounds" id="backgroundPanel">
      <div class="bg-opacity-row">
        <label for="bgOpacity">背景の濃さ</label>
        <input id="bgOpacity" type="range" min="10" max="100" step="5" value="35">
        <span class="option-value" id="bgOpacityValue">35%</span>
      </div>
      <div class="bg-grid" id="bgGrid"></div>
      <div class="bg-tools">
        <button id="bgExportBtn">背景設定を保存</button>
        <button id="bgImportBtn">背景設定を読込</button>
      </div>
      <div class="bg-note">画像は登録時に背景用サイズへ自動縮小して、この端末のブラウザ内に保存されます。「背景設定を保存」で8面の画像と濃さを1ファイルに書き出せます。</div>
      <input class="hidden-file" id="bgImageInput" type="file" accept="image/*">
      <input class="hidden-file" id="bgImportInput" type="file" accept="application/json,.json">
    </div>

    <div class="confirm" id="resetConfirm">
      本当に全8面をリセットしますか？
      <div class="confirm-actions">
        <button class="danger" id="resetYes">リセットする</button>
        <button class="cancel" id="resetNo">キャンセル</button>
      </div>
    </div>
  </div>
</div>

<div class="armor-pop" id="armorPop">
  <h3>アーマー</h3>
  <label><input type="checkbox" id="cyberChk"> サイバネアーマー</label>
  <label><input type="checkbox" id="lightChk"> ライトシールド</label>
  <label><input type="checkbox" id="bodyChk"> ボディーアーマー</label>
  <button id="armorClose">閉じる</button>
</div>

<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/game-rules.js"></script>
<script src="js/background-storage.js"></script>
<script src="js/board-ui.js"></script>
<script src="js/menu-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
